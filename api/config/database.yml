# Configuración de PostgreSQL.
# Los datos de conexión se leen de variables de entorno (definidas en
# docker-compose.yml) para no dejar credenciales fijas en el código.
default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  host: <%= ENV.fetch("DATABASE_HOST", "localhost") %>
  username: <%= ENV.fetch("DATABASE_USER", "postgres") %>
  password: <%= ENV.fetch("DATABASE_PASSWORD", "postgres") %>

development:
  <<: *default
  database: niu_orders_development

# La base de test es independiente para que RSpec nunca toque datos de desarrollo.
test:
  <<: *default
  database: niu_orders_test

# En producción la conexión completa llega por DATABASE_URL.
production:
  <<: *default
  url: <%= ENV["DATABASE_URL"] %>