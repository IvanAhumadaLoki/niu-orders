# Entorno de desarrollo local.
# Levantar todo:  docker compose up --build
services:
  # Base de datos PostgreSQL. Los datos persisten en el volumen `pg_data`.
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - pg_data:/var/lib/postgresql/data
    # La API espera a que PostgreSQL acepte conexiones antes de arrancar.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  # API Rails (puerto 3000).
  api:
    build:
      context: ./api
      dockerfile: Dockerfile.dev
    # `bundle check || bundle install` instala gemas nuevas al arrancar;
    # se borra server.pid por si el contenedor anterior se cerró mal.
    command: >
      bash -c "bundle check || bundle install &&
               rm -f tmp/pids/server.pid &&
               bin/rails server -b 0.0.0.0 -p 3000"
    environment:
      DATABASE_HOST: db
      DATABASE_USER: postgres
      DATABASE_PASSWORD: postgres
      # Dónde están las tiendas. En desarrollo apunta a la tienda simulada de
      # esta misma API; `api` es el nombre del servicio dentro de la red de
      # Docker, así también lo podrá usar el contenedor de Sidekiq más adelante.
      STORE_BASE_URL: http://api:3000/mock_store
      # Probabilidad (0 a 1) de que la tienda simulada responda con un error.
      # Ejemplo:  MOCK_STORE_FAILURE_RATE=0.5 docker compose up -d
      MOCK_STORE_FAILURE_RATE: ${MOCK_STORE_FAILURE_RATE:-0}
    volumes:
      # Código fuente: los cambios en tu editor se ven al instante en el contenedor.
      - ./api:/app
      # Gemas persistentes entre reinicios (evita reinstalar todo cada vez).
      - bundle_cache:/usr/local/bundle
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pg_data:
  bundle_cache: